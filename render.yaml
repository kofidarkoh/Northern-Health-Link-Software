# ============================================
# Northern Health Link — Render Blueprint
# Generated from .env keys (dev values intentionally NOT copied:
# localhost/MySQL-localhost/placeholder secrets must not ship to prod),
# plus DATABASE_URL / MYSQL_SSL_CA_CONTENT (see MySQL notes below).
# Docs: https://render.com/docs/blueprint-spec
# Deploy: push this repo, then Dashboard → New → Blueprint → select repo.
# NOTE: Render auto-detects `render.yaml` (not `render.yml`) at repo root.
# ============================================

services:
  # ---- Redis-compatible cache (JWT blacklist, Flask-Caching, SocketIO) ----
  - type: keyvalue
    name: nhls-redis
    region: frankfurt
    plan: free # upgrade if memory fills (JWT blacklist lives here)
    maxmemoryPolicy: noeviction # JWT blacklist entries must not be evicted early
    ipAllowList: [] # required field: empty = no EXTERNAL access, Render-internal only

  # ---- Flask + SocketIO API (gevent websocket worker) ----
  - type: web
    name: nhls-api
    region: frankfurt # closest region to Ghana; keep DB (Aiven) in the same region
    runtime: python
    plan: free # needs Starter+ if you attach the uploads disk below
    numInstances: 1 # keep at 1: SocketIO broadcasts need SOCKETIO_MESSAGE_QUEUE=1 to span instances
    buildCommand: pip install -r requirements.txt && python migrate.py migrate
    # Free tier has no preDeployCommand, so versioned migrations
    # (migrations/versions/) run as the last build step instead. The runner
    # is idempotent (schema_migrations-tracked, safe=True), so re-running
    # on every build is harmless.
    # start.sh binds 127.0.0.1:5000 — Render requires 0.0.0.0:$PORT.
    startCommand: gunicorn -k geventwebsocket.gunicorn.workers.GeventWebSocketWorker -w 1 --timeout 120 -b 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /health
    # ---- Persistent uploads (lab result PHI) ----
    # Render disks are ephemeral by default: redeploys WIPE uploads/.
    # For real PHI, uncomment the disk and point UPLOAD_FOLDER at it
    # (requires a paid instance type).
    # disk:
    #   name: nhls-uploads
    #   mountPath: /opt/render/project/src/uploads
    #   sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: FLASK_ENV
        value: production # wsgi.py defaults to production; explicit is safer
      - key: SECRET_KEY
        generateValue: true # generated once on first create; reuse, never commit
      - key: JWT_SECRET_KEY
        generateValue: true

      # ---- MySQL (Render has no MySQL — use Aiven, same region as above) ----
      # Single-URL form (takes precedence; discrete vars below may be left empty):
      # e.g. mysql://avnadmin:secret@xxx.aivencloud.com:25060/defaultdb
      - key: DATABASE_URL
        sync: false
      - key: MYSQL_HOST
        sync: false # e.g. xxx.aivencloud.com (Dashboard will prompt)
      - key: MYSQL_PORT
        value: 25060 # Aiven default; change if yours differs
      - key: MYSQL_DATABASE
        sync: false # e.g. defaultdb
      - key: MYSQL_USER
        sync: false # e.g. avnadmin
      - key: MYSQL_PASSWORD
        sync: false
      # Aiven ENFORCES SSL. If neither CA var is set, the app sets
      # ssl_disabled=True and the connection FAILS. Preferred for Render:
      # paste the Aiven CA certificate text into MYSQL_SSL_CA_CONTENT
      # (Aiven console → service → CA certificate; Render dashboard accepts
      # multiline values). The app writes it to a temp file at boot.
      # Alternative: commit ca.pem (public cert, safe) and set MYSQL_SSL_CA
      # to its path — resolves relative to the repo root (see startCommand).
      - key: MYSQL_SSL_CA
        sync: false
      - key: MYSQL_SSL_CA_CONTENT
        sync: false

      # ---- Redis (wired from nhls-redis above; ProductionConfig needs it) ----
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: nhls-redis
          property: connectionString
      # Single gunicorn worker: keep the in-memory SocketIO queue.
      # Set to 1 only if you raise workers above 1.
      - key: SOCKETIO_MESSAGE_QUEUE
        value: 0

      # ---- CORS: must list every origin that calls the API ----
      - key: CORS_ORIGINS
        sync: false # e.g. https://your-expo-web-app.com (comma-separated)

      - key: LOG_LEVEL
        value: INFO

      # ---- Uploads ----
      # Default is relative (uploads/lab_results) = EPHEMERAL on Render.
      # With the disk above enabled, change this value to the absolute path:
      # /opt/render/project/src/uploads/lab_results
      - key: UPLOAD_FOLDER
        value: uploads/lab_results
      - key: MAX_CONTENT_LENGTH
        value: 16777216 # 16 MB; lab.py enforces 10 MB per file on top

# ============================================================
# NOT in this file (handled outside Render):
# - frontend/.env → EXPO_PUBLIC_API_URL=https://nhls-api.onrender.com
#   (set in the Expo build profile; the mobile app is NOT deployed here)
# - MySQL itself (Aiven) + CA cert via MYSQL_SSL_CA_CONTENT (see note above)
# - Python pin is doubled: PYTHON_VERSION below + .python-version at repo root
# ============================================================
